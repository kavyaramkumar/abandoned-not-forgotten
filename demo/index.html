<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reach for the Stars Museum · Project Demo</title>
  <meta name="description" content="Watch the 30-second project demonstration for Reach for the Stars Museum.">
  <style>
    :root {
      color-scheme: dark;
      --night: #070b18;
      --panel: #11182b;
      --ink: #f7f1df;
      --muted: #b8c4dc;
      --gold: #f3c95c;
      --blue: #68d8ff;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 18px;
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 20% 10%, #18305a 0, transparent 34%),
        radial-gradient(circle at 85% 25%, #41275b 0, transparent 28%),
        var(--night);
    }
    main { width: min(1040px, 100%); }
    .eyebrow {
      margin: 0 0 10px;
      color: var(--blue);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      max-width: 850px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.2rem, 7vw, 5.5rem);
      line-height: .95;
    }
    .tagline {
      margin: 18px 0 28px;
      color: var(--muted);
      font-size: clamp(1rem, 2.4vw, 1.3rem);
    }
    .player {
      overflow: hidden;
      border: 1px solid #ffffff24;
      border-radius: 18px;
      background: #000;
      box-shadow: 0 28px 80px #0009, 0 0 0 1px #68d8ff14 inset;
    }
    video { display: block; width: 100%; aspect-ratio: 16 / 9; }
    .meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 22px;
    }
    .meta p { margin: 0; color: var(--muted); }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    a {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 10px 16px;
      border: 1px solid #ffffff35;
      border-radius: 999px;
      color: var(--ink);
      font-weight: 750;
      text-decoration: none;
    }
    a.primary { border-color: var(--gold); background: var(--gold); color: #18120a; }
    a:hover, a:focus-visible { transform: translateY(-1px); box-shadow: 0 8px 24px #0006; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">30-second project demonstration</p>
    <h1>Reach for the Stars Museum</h1>
    <p class="tagline">Their missions ended. Their stories didn’t.</p>

    <div class="player">
      <video controls playsinline preload="metadata" aria-label="Reach for the Stars Museum project demonstration">
        <source src="./Reach-for-the-Stars-Museum-Project-Demo.mp4" type="video/mp4">
        Your browser does not support embedded video. <a href="./Reach-for-the-Stars-Museum-Project-Demo.mp4">Download the MP4</a>.
      </video>
    </div>

    <div class="meta">
      <p>Team Reach for the Stars · Abandoned but Not Forgotten</p>
      <div class="actions">
        <a class="primary" href="../">Launch the museum</a>
        <a href="https://github.com/kavyaramkumar/abandoned-not-forgotten">View the source</a>
      </div>
    </div>
  </main>
</body>
</html>
